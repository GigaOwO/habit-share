<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>習慣シェアボード</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>習慣シェアボード</h1>
        <span id="today-date"></span>
      </header>

      <section id="today-section">
        <h2>今日のタスク</h2>
        <ul id="today-list"></ul>
      </section>

      <section id="week-section">
        <h2>今週の達成</h2>
        <p id="week-summary"></p>
        <div id="week-dots"></div>
      </section>

      <section id="friends-section">
        <h2>みんなの今日</h2>
        <ul id="friends-list"></ul>
      </section>

      <section id="add-section">
        <h2>習慣を追加</h2>
        <form id="add-form">
          <input id="title-input" type="text" placeholder="やること" />
          <fieldset id="day-checks">
            <label><input type="checkbox" name="day" value="0" />日</label>
            <label><input type="checkbox" name="day" value="1" />月</label>
            <label><input type="checkbox" name="day" value="2" />火</label>
            <label><input type="checkbox" name="day" value="3" />水</label>
            <label><input type="checkbox" name="day" value="4" />木</label>
            <label><input type="checkbox" name="day" value="5" />金</label>
            <label><input type="checkbox" name="day" value="6" />土</label>
          </fieldset>
          <button type="submit">追加する</button>
        </form>
        <div id="error-message"></div>
        <ul id="routine-list"></ul>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
